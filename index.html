<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SEGURA//DIAG — Diagnóstico de Segurança Digital</title>
  <meta name="theme-color" content="#0a0a0a">
  <script>
    // Decide o tema ANTES da primeira pintura, para a página não nascer num
    // tema e trocar depois. Prioridade:
    //   1. escolha manual salva pelo usuário;
    //   2. preferência do navegador/sistema (prefers-color-scheme);
    //   3. escuro, quando nada disso estiver disponível.
    // A chave é a mesma de utils/storage.js e a ordem aqui tem que ser
    // idêntica à de loadTheme() de lá: são as duas pontas da mesma regra.
    (function () {
      var t = 'dark'
      var prefereClaro = function () {
        try {
          return !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches)
        } catch (e) { return false }
      }
      try {
        var salvo = localStorage.getItem('segura_tema')
        t = (salvo === 'light' || salvo === 'dark') ? salvo : (prefereClaro() ? 'light' : 'dark')
      } catch (e) {
        // armazenamento bloqueado (janela anônima, política do navegador):
        // ainda dá para seguir o navegador
        t = prefereClaro() ? 'light' : 'dark'
      }
      document.documentElement.setAttribute('data-theme', t)
      var meta = document.querySelector('meta[name="theme-color"]')
      if (meta) meta.setAttribute('content', t === 'light' ? '#ebe9e3' : '#0a0a0a')
    })()
  </script>
  <meta name="description" content="Autoavaliação de segurança digital para pequenas empresas: nota de 0 a 100 e plano de ação priorizado.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

</head>

</body>
</html>
